name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install packages
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: Put Briefcase icon
        run: |
          cp www/Briefcase.png android/app/src/main/res/drawable/briefcase.png
          sed -i 's#android:icon="@mipmap/ic_launcher"#android:icon="@drawable/briefcase"#' android/app/src/main/AndroidManifest.xml

      - name: Sync project
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Expense-Tracker-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
