<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2e8b57" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>د لګښت تعقیبونکی</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="shortcut icon" href="Briefcase.png" type="image/x-icon">
  </head>
  <body>
    <div class="container">
      <div class="title-row">
        <h1>د لګښت تعقیبونکی</h1>
        <button id="theme-toggle" class="theme-toggle">🌙</button>
      </div>
      
      <div class="balance-container">
        <h2>ستاسو بیلانس</h2>
        <h1 id="balance">$0.00</h1>
        <div class="summary">
          <div class="income">
            <h3>عاید</h3>
            <p id="income-amount">$0.00</p>
          </div>
          <div class="expenses">
            <h3>لګښتونه</h3>
            <p id="expense-amount">$0.00</p>
          </div>
        </div>1
        <small>👑 𝑨𝒃𝒅𝒖𝒍𝒍𝒂𝒉 | نوُرزی 👑</small>
      </div>
      <div class="main-content">
        <div class="transaction-container">
          <h2>لیږدونې</h2>
          <ul id="transaction-list"></ul>
        </div>
        <div class="form-container">
          <h2>معامله اضافه کړئ</h2>
          <form id="transaction-form">
            <div class="form-group">
              <label for="description">تفصیل</label>
              <input
                type="text"
                id="description"
                placeholder= "...توضیحات دننه کړئ"
                required
              />
            </div>
          <div class="form-group">
              <label for="amount">مقدار</label>
              <input
                type="number"
                id="amount"
                placeholder="...مقدار داخل کړئ"
                required
              />
              <small>.د لګښت لپاره منفي (-) وکاروئ</small>
            </div>
            <button type="submit">اضافه کړئ</button>
          </form>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
